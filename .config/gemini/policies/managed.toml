# Gemini CLI policy rules mirroring the Claude Code permission tiers in
# .config/claude/settings.json (permissions.allow / ask / deny):
#
#   Claude allow -> decision = "allow"     priority 100
#   Claude ask   -> decision = "ask_user"  priority 500
#   Claude deny  -> decision = "deny"      priority 900
#
# Highest priority wins, so the tier precedence matches Claude's
# deny > ask > allow. commandPrefix is plain string-prefix matching on the
# shell command; Gemini splits chained commands (&&, ;, |) and checks each
# part, so a denied segment blocks the whole chain.
#
# Delivered by the dotfiles repo (home-manager/dotfiles.nix). Approvals saved
# from the confirmation dialog land in a separate generated file, not here.

# --- allow tier -------------------------------------------------------------

# Bash parity: every shell command not narrowed by an ask_user/deny rule.
[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
allowRedirection = true

# Read / Edit / Write / WebFetch / WebSearch parity.
[[rule]]
toolName = [
  "read_file",
  "read_many_files",
  "list_directory",
  "glob",
  "search_file_content",
  "replace",
  "write_file",
  "web_fetch",
  "google_web_search",
  "save_memory",
]
decision = "allow"
priority = 100

# mcp__plugin_mcp_* parity: every tool from every configured MCP server.
[[rule]]
mcpName = "*"
toolName = "*"
decision = "allow"
priority = 100

# --- ask tier ---------------------------------------------------------------

[[rule]]
commandPrefix = [
  "git push",
  "git rebase",
  "git reset",
  "git clean",
  "gh pr create",
  "gh pr merge",
  "gh issue create",
  "gh release create",
  "gh gist create",
  "gh workflow run",
  "sudo",
  "npm uninstall",
  "npm remove",
  "npm publish",
  "pnpm publish",
  "cargo publish",
  "docker system prune",
  "kubectl delete",
  "aws s3 cp",
  "aws s3 sync",
  "aws s3 mv",
  "aws ec2 run-instances",
  "aws ec2 start-instances",
  "aws ec2 stop-instances",
  "aws lambda create-function",
  "aws lambda update-function-code",
  "aws cloudformation create-stack",
  "aws cloudformation update-stack",
]
decision = "ask_user"
priority = 500

# --- deny tier --------------------------------------------------------------

[[rule]]
commandPrefix = [
  "rm -rf",
  "rm -fr",
  "rm -r -f",
  "rm -f -r",
  "rm --recursive",
  "chmod 777",
  "chmod -R 777",
  "dd",
  "gh repo delete",
  "gh auth logout",
  "gh secret delete",
  "gh variable delete",
  "aws s3 rm",
  "aws s3 rb",
  "aws ec2 terminate-instances",
  "aws rds delete-db-instance",
  "aws rds delete-db-cluster",
  "aws lambda delete-function",
  "aws iam delete-",
  "aws cloudformation delete-stack",
  "aws dynamodb delete-table",
  "aws sns delete-topic",
  "aws sqs delete-queue",
  "terraform apply",
  "terraform destroy",
  "terraform state push",
  "terraform state rm",
  "terragrunt apply",
  "terragrunt destroy",
  "just apply",
  "brew install",
  "brew uninstall",
  "brew bundle",
]
decision = "deny"
priority = 900
denyMessage = "Blocked by managed policy (mirrors Claude Code's deny list). Homebrew is declarative via nix-homebrew; destructive deletes need to be run by hand."

# Read(.env / secrets) parity. argsPattern is a regex over the JSON-encoded
# tool arguments, so a closing quote anchors the end of the path.
[[rule]]
toolName = ["read_file", "read_many_files"]
argsPattern = '/\.env(\.[^"]*)?"|/\.envrc"|/\.ssh/id_|/\.gnupg/|/\.aws/|/credentials\.json"|\.token"|/secrets/|/run/agenix/'
decision = "deny"
priority = 900
denyMessage = "Secret material; blocked by managed policy."

# Edit(.env / ~/.ssh / ~/.aws) parity.
[[rule]]
toolName = ["write_file", "replace"]
argsPattern = '/\.env($|[."])|/\.envrc"|/\.ssh/|/\.aws/'
decision = "deny"
priority = 900
denyMessage = "Secret material; blocked by managed policy."

# mcp deny parity: serena's shell escape hatch stays off.
[[rule]]
mcpName = "serena"
toolName = "execute_shell_command"
decision = "deny"
priority = 900
