# ~/.codex/config.toml links here on the work host (config.toml on the other
# host; home-manager/dotfiles.nix picks the file) and Codex writes through the
# link (/model, project trust, plugin installs, hook trust), so a change made
# in Codex shows up as a diff in this repo: commit it or revert it. Keep this
# the only layer; anything in /etc/codex/config.toml is shadowed by what Codex
# writes here. One file per host because both hosts write state (trust, hook
# hashes) and a shared file made every pull a conflict. Codex has no include,
# so the settings down to [plugins] are repeated in config.toml: change them in
# both.

# No model or model_reasoning_effort: /model writes them.
personality = "pragmatic"

# Pinned so an upstream default change cannot quietly widen what the agent may do.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Approval prompts go to the reviewer subagent instead of a keystroke; the
# sandbox boundary is unchanged. Needs an interactive approval_policy: under
# "never" no approval request is raised for the reviewer to see. Accepted
# trade-off: the reviewer reads the same tool output as the agent, so content
# fetched from the web can reach both at once; convenience won over a human
# in the loop.
approvals_reviewer = "auto_review"

web_search = "live"

# Codex only supports vscode/vscode-insiders/windsurf/cursor here; the editor is Zed.
file_opener = "none"

# Codex adds its own trailer only when a ChatGPT workspace policy asks for it;
# without one (personal account) nothing is added.
developer_instructions = "End every commit message with the trailer `Co-authored-by: Codex <noreply@openai.com>`. Keep existing trailers and never duplicate it."
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
service_tier = "fast"

[sandbox_workspace_write]
network_access = false

[features]
# The CLI comes from mise, so the in-app updater would write to a different npm
# prefix than the one on PATH. Upgrade with `mise upgrade npm:@openai/codex`.
in_app_updates = false
# Off by default today; pinned so a default flip cannot start storing memories.
memories = false
multi_agent_v2 = true

[agents]
# Counts the root thread, so four concurrent subagents.
max_concurrent_threads_per_session = 5

[marketplaces.codex-plugins]
source_type = "git"
source = "https://github.com/kkhys/codex-plugins.git"

[plugins."base@codex-plugins"]
enabled = true

[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
theme = "catppuccin-mocha"
notifications = true
notification_condition = "unfocused"

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

