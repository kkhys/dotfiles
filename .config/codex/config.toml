# ~/.codex/config.toml links here and Codex writes through the link (/model,
# project trust, plugin installs, hook trust), so a change made in Codex shows
# up as a diff in this repo: commit it or revert it. Keep this the only layer;
# anything in /etc/codex/config.toml is shadowed by what Codex writes here.

# No model or model_reasoning_effort: /model writes them.
personality = "pragmatic"

# Pinned so an upstream default change cannot quietly widen what the agent may do.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Approval prompts go to the reviewer subagent instead of a keystroke; the
# sandbox boundary is unchanged. Needs an interactive approval_policy: under
# "never" no approval request is raised for the reviewer to see.
approvals_reviewer = "auto_review"

web_search = "live"

# Codex only supports vscode/vscode-insiders/windsurf/cursor here; the editor is Zed.
file_opener = "none"

# Codex adds its own trailer only when a ChatGPT workspace policy asks for it;
# without one (personal account) nothing is added.
developer_instructions = "End every commit message with the trailer `Co-authored-by: Codex <noreply@openai.com>`. Keep existing trailers and never duplicate it."

[sandbox_workspace_write]
network_access = false

[features]
# The CLI comes from mise, so the in-app updater would write to a different npm
# prefix than the one on PATH. Upgrade with `mise upgrade npm:@openai/codex`.
in_app_updates = false
memories = true
multi_agent_v2 = true

[agents]
# Counts the root thread, so four concurrent subagents.
max_concurrent_threads_per_session = 5

[marketplaces.codex-plugins]
source_type = "git"
source = "https://github.com/kkhys/codex-plugins.git"

